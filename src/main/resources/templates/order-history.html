<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Order History</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; }
        .alert-success { color: green; padding: 10px; border: 1px solid green; margin-bottom: 20px; background-color: #e6ffe6; }
        table { width: 100%; text-align: left; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; }
        th { background-color: #f4f4f4; }
        .text-center { text-align: center; }
    </style>
</head>
<body>
    <div class="header-flex">
        <h1>My Orders</h1>
        <a th:href="@{/catalog}">← Back to Catalog</a>
    </div>
    <hr>

    <div th:if="${param.success}" class="alert-success">
        Order placed successfully!
    </div>

    <table>
        <thead>
            <tr>
                <th>Order ID</th>
                <th>Date</th>
                <th>Total</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}">1</td>
                <td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">Date</td>
                <td th:text="${'$' + order.total}">$0.00</td>
                <td><strong th:text="${order.status}">NEW</strong></td>
                <td><a th:href="@{'/order/' + ${order.id}}">View Receipt</a></td>
            </tr>
            <tr th:if="${orders.isEmpty()}">
                <td colspan="5" class="text-center">You haven't placed any orders yet.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
