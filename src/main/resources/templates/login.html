<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Campus Store - Login</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 0 20px; }
        .alert-success { color: green; margin-bottom: 15px; padding: 10px; background-color: #e6ffe6; border: 1px solid green; }
        .alert-error { color: red; margin-bottom: 15px; }
        .alert-info { color: blue; margin-bottom: 15px; }
        .auth-form { display: flex; flex-direction: column; gap: 15px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        .btn-success { padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; font-size: 16px; }
        .text-center { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Login to Campus Store</h2>

    <div th:if="${param.registered}" class="alert-success">
        Account created successfully! You can now log in.
    </div>
    <div th:if="${param.error}" class="alert-error">
        Invalid email or password.
    </div>
    <div th:if="${param.logout}" class="alert-info">
        You have been successfully logged out.
    </div>

    <form th:action="@{/login}" method="post" class="auth-form">
        <label>Email Address:
            <input type="text" name="username" required />
        </label>
        
        <label>Password:
            <input type="password" name="password" required />
        </label>

        <button type="submit" class="btn-success">Log In</button>
    </form>

    <p class="text-center">
        Need an account? <a th:href="@{/register}">Register here</a>.
    </p>
</body>
</html>
