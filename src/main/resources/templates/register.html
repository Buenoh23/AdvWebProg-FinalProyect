<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Campus Store - Register</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto;">

    <h2>Create a Customer Account</h2>

    <div th:if="${param.error}" style="color: red; margin-bottom: 15px;">
        That email address is already in use. Please try another.
    </div>

    <form th:action="@{/register}" method="post" style="display: flex; flex-direction: column; gap: 15px;">
        <label>
            Full Name:<br>
            <input type="text" name="name" required style="width: 100%; padding: 8px;" />
        </label>
        
        <label>
            Email Address:<br>
            <input type="email" name="email" placeholder="alice@example.com" required style="width: 100%; padding: 8px;" />
        </label>
        
        <label>
            Password:<br>
            <input type="password" name="password" required style="width: 100%; padding: 8px;" />
        </label>

        <button type="submit" style="padding: 10px; background-color: #0056b3; color: white; border: none; cursor: pointer;">Register</button>
    </form>

    <p style="text-align: center; margin-top: 20px;">
        Already have an account? <a th:href="@{/login}">Log in here</a>.
    </p>

</body>
</html>
