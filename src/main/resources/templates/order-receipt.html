<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Receipt</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        table { width: 100%; text-align: left; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; }
        th { background-color: #f4f4f4; }
        .grand-total { text-align: right; margin-top: 20px; }
        .total-amount { color: green; }
    </style>
</head>
<body>
    <h1>Order Receipt #<span th:text="${order.id}"></span></h1>
    <a th:href="@{/order/history}">← Back to My Orders</a>
    <hr>

    <p><strong>Status:</strong> <span th:text="${order.status}">NEW</span></p>
    <p><strong>Date:</strong> <span th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}"></span></p>
    
    <h3>Items Purchased:</h3>
    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Qty</th>
                <th>Unit Price</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.product.name}">Product Name</td>
                <td th:text="${item.qty}">0</td>
                <td th:text="${'$' + item.unitPrice}">$0.00</td>
                <td th:text="${'$' + (item.unitPrice * item.qty)}">$0.00</td>
            </tr>
        </tbody>
    </table>

    <h2 class="grand-total">
        Grand Total: <span class="total-amount" th:text="${'$' + order.total}">$0.00</span>
    </h2>
</body>
</html>
